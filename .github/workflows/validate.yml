name: Validate GRHS release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify generated repertoire is current
        run: |
          python scripts/generate_repertoire.py
          git diff --exit-code -- data tests
      - name: Validate specification data
        run: python scripts/validate_release.py
      - name: Verify published artifacts
        run: python scripts/verify_checksums.py
